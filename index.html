var cur = 'splash', hist = [];
var start = (location.hash || '').replace('#', '');
if (D[start]) cur = start;

var img = document.getElementById('img'), hs = document.getElementById('hs');
var W = 433, H = 892, OX = 20, OY = 20;

function render() {
  var p = D[cur];
  img.src = p.src;
  hs.innerHTML = '';
  (p.hs || []).forEach(function (h) {
    var d = document.createElement('div');
    d.className = 'h';
    d.style.left = ((h[0] + OX) / W * 100) + '%';
    d.style.top = ((h[1] + OY) / H * 100) + '%';
    d.style.width = (h[2] / W * 100) + '%';
    d.style.height = (h[3] / H * 100) + '%';
    d.addEventListener('click', function (e) {
      e.stopPropagation();
      nav(h[4], h[5]);
    });
    hs.appendChild(d);
  });
}

function nav(to, mode) {
  mode = mode || 'go';

  if (mode === 'back' || to === 'back') {
    if (hist.length) { cur = hist.pop(); render(); }
    return;
  }
  if (!D[to]) return;

  if (mode === 'tab' || mode === 'reset') {
    hist = [];
    cur = to;
    render();
    return;
  }
  if (mode === 'backto') {
    var i = hist.lastIndexOf(to);
    if (i >= 0) { hist.length = i; cur = to; }
    else { hist = []; cur = to; }
    render();
    return;
  }

  if (to === cur) return;
  hist.push(cur);
  cur = to;
  render();
}

render();
